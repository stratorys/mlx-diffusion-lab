[project]
name = "imagegen"
version = "0.1.0"
description = "Diffusion image generation on Apple Silicon, under a unified-memory budget."
readme = "README.md"
license = "MPL-2.0"
# mflux itself only needs 3.10. Keeping the floor low is what lets the weightless
# test suite run on any interpreter, with neither mflux nor torch installed.
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pillow>=11.0",
    "numpy>=2.1",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
mflux = ["mflux>=0.19.1"]
segment = ["transformers>=5.16", "torch>=2.14"]
dev = ["pytest>=8.3", "httpx>=0.28", "ruff>=0.8"]

[project.scripts]
imagegen-sweep = "imagegen.cli.sweep:main"
imagegen-sheet = "imagegen.cli.sheet:main"
imagegen-serve = "imagegen.cli.serve:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/imagegen"]

[tool.ruff]
line-length = 110
src = ["src", "tests", "bench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# tests/conftest.py is imported as `tests.conftest` by several modules, so the
# project root has to be importable. Without this the suite does not even collect.
pythonpath = ["."]
